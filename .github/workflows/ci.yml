name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'

    - name: Cache Coursier
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/coursier
          ~/.local/share/coursier
          ~/.sbt
          ~/.ivy2/cache
        key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.sbt', 'project/**') }}
        restore-keys: |
          ${{ runner.os }}-coursier-

    - name: Setup sbt
      run: |
        curl -fL https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz | gzip -d > cs
        chmod +x cs
        ./cs setup --yes --jvm 25
        echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

    - name: Check formatting
      run: sbt scalafmtCheckAll scalafmtSbtCheck

    - name: Compile
      run: sbt compile

    - name: Run tests
      run: sbt test

    - name: Build documentation
      run: sbt doc
